name: Release NXGS Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild intentionally (for example v0.7.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows package
        run: npm run build:win

      - name: Generate update manifest
        shell: pwsh
        run: |
          ./scripts/generate-update-manifest.ps1 `
            -Installer "release/NXGS-Play-Setup.exe" `
            -DownloadUrl "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/NXGS-Play-Setup.exe" `
            -Output "updates/windows-update.json" `
            -Notes "NXGS Play ${{ inputs.release_tag }} is ready to install."

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            release/NXGS-Play-Setup.exe
            release/NXGS-Play-Setup.exe.blockmap
            release/NXGS-Play.exe
            release/latest.yml
            updates/windows-update.json
